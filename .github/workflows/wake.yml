# Wakes the reward server once an hour. On Render's free plan the service sleeps
# when nobody calls it, and a sleeping server can't fetch Powerfox readings or
# pay a reading that arrived during the cooldown. /cron/tick only starts work the
# server would do on its own, and runs it at most once every ten minutes.
name: Wake the reward server
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    # At go-live this server becomes the mainnet server and the testnet moves to a
    # new one (docs/MAINNET.md): put that one's address in TESTNET_SERVER then.
    env:
      TESTNET_SERVER: ""
    steps:
      - name: Reward server
        run: curl -fsS --max-time 150 https://greenutilitylog-rewards.onrender.com/cron/tick || echo "::warning title=wake::server did not answer"
      - name: Testnet server (after go-live)
        if: env.TESTNET_SERVER != ''
        run: curl -fsS --max-time 150 "$TESTNET_SERVER/cron/tick" || echo "::warning title=wake::testnet server did not answer"
