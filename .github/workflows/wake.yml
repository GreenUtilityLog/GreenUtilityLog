# A BACKUP wake-up for the reward server. GitHub runs scheduled workflows when it
# has room, not on time: "hourly" came out as about three runs a day (November
# 2026). The real wake-up is an outside monitor calling /cron/tick every 5 minutes
# (UptimeRobot, docs/MAINNET.md "De wekker"); this stays as a fallback.
# On Render's free plan the service sleeps when nobody calls it, and a sleeping
# server can't fetch Powerfox readings or pay a reading that is still unpaid.
# /cron/tick only starts work the server would do on its own (cloud pulls, unpaid
# readings), and runs it at most once every ten minutes.
name: Wake the reward server
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    # At go-live this server becomes the mainnet server and the testnet moves to a
    # new one (docs/MAINNET.md): put that one's address in TESTNET_SERVER then.
    env:
      TESTNET_SERVER: ""
    steps:
      - name: Reward server
        run: curl -fsS --max-time 150 https://greenutilitylog-rewards.onrender.com/cron/tick || echo "::warning title=wake::server did not answer"
      - name: Testnet server (after go-live)
        if: env.TESTNET_SERVER != ''
        run: curl -fsS --max-time 150 "$TESTNET_SERVER/cron/tick" || echo "::warning title=wake::testnet server did not answer"
