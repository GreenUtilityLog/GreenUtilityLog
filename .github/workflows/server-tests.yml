# The reward backend had no tests and nothing in CI touched it, so every rule that
# decides what a wallet is paid — cooldown, monotonicity, plausible bounds, photo
# dedupe, the tariff-register sum, the two baseline corrections — was verified only
# by hand, if at all. That is why testers kept finding these first.
#
# These boot the real server against a throwaway state file with the chain stubbed
# at its one chokepoint (DISTRIBUTOR_DRY_RUN), so a payout completes and its effects
# can be asserted. Nothing inside the server is mocked.
name: Server tests

# Deliberately NOT filtered by path. Render deploys this repository on every commit
# to main, so if deploys are gated on CI passing, every commit needs a check to wait
# for — including one that touches only the frontend. With a path filter such a
# commit produces no check at all, and the gate either blocks forever or waves it
# through. The job takes about a minute; certainty is worth more than that.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The same major line Render runs (server/package.json engines).
          node-version: 26
      # npm install, not ci: the server's optional deps (tesseract, sharp) don't all
      # build on every runner and none of them are needed for these tests.
      - run: npm install --omit=optional
        working-directory: server
      # sharp IS needed: the photo-likeness check (one meter, many wallets) decodes
      # real images, and its test does too. It ships prebuilt for this runner.
      - run: npm install --no-save sharp
        working-directory: server
      - run: npm test
        working-directory: server

  # The app: a name used but never defined builds fine and only breaks in the
  # browser, on the screen that uses it (a removed handler once took the Meter
  # screen down). The linter catches that before deploy; the build catches the rest.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # Lint-only tools, not app dependencies (eslint.config.mjs).
      - run: npm install --no-save eslint@9.39.1 globals@15.15.0 eslint-plugin-react@7.37.5 eslint-plugin-react-hooks@5.2.0
      - run: npx eslint src
      - run: npm run build

  # The bridge is downloaded as one loose gul.js and run on whatever Node the user
  # has — Debian/Raspberry Pi OS ship 18. It once failed to even start there.
  bridge:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test bridge/test.js
