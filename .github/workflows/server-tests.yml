# The reward backend had no tests and nothing in CI touched it, so every rule that
# decides what a wallet is paid — cooldown, monotonicity, plausible bounds, photo
# dedupe, the tariff-register sum, the two baseline corrections — was verified only
# by hand, if at all. That is why testers kept finding these first.
#
# These boot the real server against a throwaway state file with the chain stubbed
# at its one chokepoint (DISTRIBUTOR_DRY_RUN), so a payout completes and its effects
# can be asserted. Nothing inside the server is mocked.
name: Server tests

# Deliberately NOT filtered by path. Render deploys this repository on every commit
# to main, so if deploys are gated on CI passing, every commit needs a check to wait
# for — including one that touches only the frontend. With a path filter such a
# commit produces no check at all, and the gate either blocks forever or waves it
# through. The job takes about a minute; certainty is worth more than that.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The same major line Render runs (server/package.json engines).
          node-version: 26
      # npm install, not ci: the server's optional deps (tesseract, sharp) don't all
      # build on every runner and none of them are needed for these tests.
      - run: npm install --omit=optional
        working-directory: server
      # sharp IS needed: the photo-likeness check (one meter, many wallets) decodes
      # real images, and its test does too. It ships prebuilt for this runner.
      - run: npm install --no-save sharp@0.35.5   # the version in server/package-lock.json
        working-directory: server
      - run: npm test
        working-directory: server

  # The app: a name used but never defined builds fine and only breaks in the
  # browser, on the screen that uses it (a removed handler once took the Meter
  # screen down). The linter catches that before deploy; the build catches the rest.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # Lint-only tools, not app dependencies (eslint.config.mjs).
      - run: npm install --no-save eslint@9.39.1 globals@15.15.0 eslint-plugin-react@7.37.5 eslint-plugin-react-hooks@5.2.0
      - run: npx eslint src
      # Every language complete: keys, {placeholders}, links, the ⚠️ a warning starts with, Help.
      - run: node scripts/check-langs.mjs
      # The leaderboard's "this week" and streak (src/board.js).
      - run: node scripts/test-board.mjs
      # The same checks the Pages deploy makes before it publishes (deploy.yml), on
      # every PR too: a missed version bump in #200 stopped every deploy, unnoticed
      # until the failure mails. scripts/check-release.sh says what is checked.
      - run: bash scripts/check-release.sh
      # A changed helper needs a new add-on version, or Home Assistant never offers it.
      - name: Add-on version bumped with its helper
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.base_ref }}
          bash scripts/check-addon-bump.sh FETCH_HEAD
      - run: npm run build
      # Everything else the deploy does: the testnet copy, and the static files it
      # publishes alongside (a renamed one would only fail the deploy otherwise).
      - name: Testnet copy and published files, as the deploy builds them
        run: |
          npx vite build --outDir /tmp/pages/testnet
          bash scripts/pages-assets.sh /tmp/pages
        env:
          VITE_BASE: /GreenUtilityLog/testnet/
          VITE_NETWORK: testnet
          VITE_TESTNET_BANNER: "1"

  # The bridge is downloaded as one loose gul.js and run on whatever Node the user
  # has — Debian/Raspberry Pi OS ship 18. It once failed to even start there.
  bridge:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test bridge/test.js

  # Windows and macOS are where most people run the helper, and Linux was all CI
  # ever ran it on. (The install tests that need cron skip themselves on Windows.)
  bridge-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A test that hangs fails the job instead of holding it for hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test --test-force-exit --test-timeout=120000 bridge/test.js
