name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Read-only by default: the build job runs `npm ci` (third-party install scripts),
# so the rights to publish are given to the deploy job alone.
permissions:
  contents: read

# One deploy at a time; a newer push waits for the running one instead of racing it.
concurrency:
  group: pages
  cancel-in-progress: false

# The app at /GreenUtilityLog/, for the network in MAIN_NETWORK. Since the go-live
# (28 November 2026) that is mainnet, with the server that was testnet: every
# installed reader keeps sending to it. There is no testnet copy any more (owner's
# choice, no testnet server); /GreenUtilityLog/testnet/ only sends people to the app
# (scripts/pages-assets.sh). A test build still works locally: npm run dev.
env:
  MAIN_NETWORK: mainnet
  MAINNET_API: https://greenutilitylog-rewards.onrender.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Install the EXACT versions from package-lock.json. This makes every
      # deploy reproducible — without it (npm install, no lockfile) a dependency
      # could silently update between builds and break the app, e.g. two copies
      # of valtio crashing dapp-kit. Requires package-lock.json to be committed.
      - run: npm ci
      - name: Build the main app
        run: npm run build
        env:
          VITE_NETWORK: ${{ env.MAIN_NETWORK }}
          VITE_REWARD_API: ${{ env.MAINNET_API }}
      - name: Refuse a mainnet build without a mainnet backend
        if: env.MAIN_NETWORK == 'mainnet' && env.MAINNET_API == ''
        run: echo "MAIN_NETWORK is mainnet but MAINNET_API is empty" && exit 1
      # The static files published alongside (404 page, og-image, share pages,
      # banners, icons): one script, also run on every PR (scripts/pages-assets.sh).
      - run: bash scripts/pages-assets.sh dist
      # Handed to the next job, which adds the files users run or read.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: ./dist
          retention-days: 1

  # gul.js is downloaded and run on users' own computers, every hour. It is put
  # into the site HERE, in a job that installs and runs nothing from npm: the job
  # above runs third-party install scripts and build plugins, and a compromised
  # one could otherwise have swapped the helper on its way out. Same for the guide.
  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: ./dist
      # Regenerated from bridge/index.js and checked (scripts/check-release.sh).
      - run: bash scripts/check-release.sh
      - run: cp docs/gul.js dist/gul.js && cp docs/guide.html dist/guide.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
