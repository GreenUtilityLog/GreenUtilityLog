name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Install the EXACT versions from package-lock.json. This makes every
      # deploy reproducible — without it (npm install, no lockfile) a dependency
      # could silently update between builds and break the app, e.g. two copies
      # of valtio crashing dapp-kit. Requires package-lock.json to be committed.
      - run: npm ci
      - run: npm run build
      # Publish the setup guide alongside the app so testers get a plain public URL
      # (…/GreenUtilityLog/guide.html) with no login. Copied here rather than via
      # Vite's publicDir, which is deliberately disabled — see vite.config.js.
      - run: cp docs/guide.html dist/guide.html
      # A 404 page inside the published site, so a mistyped or stale address under
      # /GreenUtilityLog/ lands somewhere that explains itself and offers a way back,
      # instead of GitHub's bare "there isn't a GitHub Pages site here".
      - run: cp docs/404.html dist/404.html
      # The guide has advertised this image in its og:image tag since it was written,
      # and it was never published — every share of that link 404'd for the crawler,
      # so the preview card came out blank.
      - run: cp docs/og-image.png dist/og-image.png
      # App icon: the browser tab and the WalletConnect prompt ("Green Utility Log
      # wants to connect") both showed a broken image before this.
      - run: cp brand/logo-256.png dist/icon.png
      # The bridge helper itself. Setup is now "download this one file and run it"
      # — no git, no clone — so the guide's and the app's commands both point here.
      # Regenerated from bridge/index.js by build_guide.py; verified below so a stale
      # copy can never be published.
      - run: |
          python3 docs/build_guide.py
          git diff --exit-code docs/gul.js docs/guide.html \
            || (echo "docs/gul.js or docs/guide.html is out of date — run docs/build_guide.py and commit" && exit 1)
          cp docs/gul.js dist/gul.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
