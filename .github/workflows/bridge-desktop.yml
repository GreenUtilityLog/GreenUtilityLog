# The helper (bridge/) on Windows and macOS, where most people run it; Linux runs
# it in server-tests.yml. (The install tests that need cron skip themselves on
# Windows.)
#
# Only on pull requests that touch the helper, not on main and not in Server
# tests: on 25 November no macOS runner was free, GitHub cancelled the job after
# 15 minutes, and Server tests (the check Render's deploy waits for) failed on a
# commit that didn't touch the bridge. A squash merge puts the tested tree on main,
# so running it again there adds nothing. A change to this file alone: run it by
# hand (workflow_dispatch).
name: Bridge on Windows and macOS

on:
  pull_request:
    paths:
      - "bridge/**"
      - "docs/gul.js"
      - "ha-addon/gul-bridge/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A test that hangs fails the job instead of holding it for hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test --test-force-exit --test-timeout=120000 bridge/test.js
