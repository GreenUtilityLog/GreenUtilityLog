# Render.com Blueprint for the reward-distributor service.
# In Render: New → Blueprint → point it at this repo. Render reads this file,
# creates the web service, and asks you for the secret value(s) marked
# `sync: false` (your distributor private key). See docs/DEPLOY_BACKEND.md.
services:
  - type: web
    name: greenutilitylog-rewards
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NETWORK
        value: testnet
      # Distributor wallet secret — set ONE of the two below in the Render dashboard
      # (kept secret, never in git). Use DISTRIBUTOR_MNEMONIC if your wallet app only
      # exports the recovery phrase; otherwise use DISTRIBUTOR_PRIVATE_KEY.
      - key: DISTRIBUTOR_PRIVATE_KEY
        sync: false
      - key: DISTRIBUTOR_MNEMONIC
        sync: false
      # Meter-photo OCR providers (all optional; first configured one wins, app
      # falls back to in-browser OCR). Set the keys/URLs in the Render dashboard.
      - key: GOOGLE_VISION_API_KEY
        sync: false
      - key: ROBOFLOW_API_KEY
        sync: false
      - key: ROBOFLOW_MODEL
        sync: false
      - key: CUSTOM_OCR_URL
        sync: false
      # AI photo-authenticity check (optional). Set ANTHROPIC_API_KEY to enable a
      # Claude vision check that rejects doctored/screenshot/watermarked/hand-drawn
      # meter photos before paying out. Costs Anthropic API usage per submission.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_PHOTO_MODEL
        sync: false
      - key: AI_PHOTO_MIN_CONFIDENCE
        sync: false
      # Lock this to your exact frontend origin once you know it, e.g.
      # https://greenutilitylog.github.io  — "*" is fine for a quick test.
      # Comma-separate to allow several origins.
      - key: ALLOWED_ORIGIN
        value: "*"
      # Anti-bot captcha (optional): Cloudflare Turnstile secret. Set it (and the
      # site key in the app) to require a captcha on each submission.
      - key: TURNSTILE_SECRET
        sync: false
      # Ban list (optional): comma-separated wallet addresses that may never claim.
      - key: BANNED_ADDRESSES
        sync: false
      # Durable state (STRONGLY recommended): without these, anti-farming state
      # (cooldowns, used photo hashes, meter ownership) lives in a local file that
      # Render's free plan WIPES on every redeploy/restart. Create a free Upstash
      # Redis database and paste its REST URL + token here to make state survive.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Per-payout sanity cap in B3TR (optional; defaults to 50).
      - key: MAX_REWARD
        sync: false
      # Photo archive (OPTIONAL — admin fraud review). Keeps a downscaled thumbnail
      # of each rewarded photo, shown per submission in admin. Two backends, first
      # configured wins:
      #   • Cloudflare R2 (below) — big, free ≤10 GB, activating R2 needs a card.
      #   • Upstash Redis — NO card, smaller; reuses the UPSTASH_REDIS_REST_* vars
      #     already set for durable state, so if those are set photos archive there
      #     automatically with a self-expiring TTL (no R2 vars needed).
      # Auto-deletes after PHOTO_RETENTION_DAYS (default 30).
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: PHOTO_RETENTION_DAYS
        sync: false
