const USAGE_BOUNDS = {
  electric: [0.5, 60],
  gas: [0.1, 20],
  water: [20, 2000],
  solar: [0.1, 80],
};

const ANOMALY_THRESHOLD = 3.5;
const COOLDOWN_HOURS = 20;

function getCooldownMs(subs, utilId) {
  const last = subs.find(s => s.type === utilId);
  if (!last || !last.submittedAt) return 0;
  const elapsed = Date.now() - last.submittedAt;
  const cooldown = COOLDOWN_HOURS * 3600 * 1000;
  return Math.max(0, cooldown - elapsed);
}

function fraudCheck(selUtil, reading, prevRead, subs, aiResult) {
  const r = parseFloat(reading), p = parseFloat(prevRead);
  const delta = r - p;
  const [minU, maxU] = USAGE_BOUNDS[selUtil];

  if (r <= p)
    return { ok:false, code:"NEGATIVE", message:"Current reading must be higher than previous." };

  if (delta < minU)
    return { ok:false, code:"TOO_LOW", message:`Usage of ${delta.toFixed(2)} is below the minimum realistic value (${minU}).` };
  if (delta > maxU)
    return { ok:false, code:"TOO_HIGH", message:`Usage of ${delta.toFixed(2)} exceeds the realistic daily maximum (${maxU}).` };

  const recent = subs.filter(s => s.type === selUtil).slice(0, 7);
  if (recent.length >= 3) {
    const avg = recent.reduce((a,s) => a + (parseFloat(s.cur)-parseFloat(s.prev)), 0) / recent.length;
    if (avg > 0 && delta > avg * ANOMALY_THRESHOLD)
      return { ok:false, code:"ANOMALY", message:`This reading is ${Math.round(delta/avg*100)}% of your average. Unusually high.` };
  }

  return { ok:true };
}

function useOnlineStatus() {
  const [online, setOnline] = useState(navigator.onLine);
  useEffect(() => {
    const handleOnline = () => setOnline(true);
    const handleOffline = () => setOnline(false);
    window.addEventListener("online", handleOnline);
    window.addEventListener("offline", handleOffline);
    return () => {
      window.removeEventListener("online", handleOnline);
      window.removeEventListener("offline", handleOffline);
    };
  }, []);
  return online;
}

  const [selUtil, setSelUtil] = useState("electric");
  const [aiOk, setAiOk] = useState(false);
  const [busy, setBusy] = useState(false);
  const [notifs, setNotifs] = useState({daily:true, streak:true, rewards:true, lb:false});

  const T = dark ? DARK : LIGHT;
  const online = useOnlineStatus();
  const css = makeCSS(T);

  const handleSelUtil = (id) => { setSelUtil(id); setReading(""); setAiOk(false); };
  const handleSubmit = async () => {
    if (!wallet) return;
    const u = getUtil(selUtil);
    const r = parseFloat(reading), p = parseFloat(prevRead);
    const delta = r - p;
    const earned = delta * u.rate;
    
    const plaus = fraudCheck(selUtil, reading, prevRead, subs, { confidence:95, secScore:92 });
    if (!plaus.ok) { alert(plaus.message); return; }
    
    setSubs(prev=>[{id:Date.now(),type:selUtil,cur:reading,prev:prevRead,date:"2026-05-05",b3tr:earned,status:"confirmed"},...prev]);
    setB3tr(p=>parseFloat((p+earned).toFixed(2)));
    setStreak(s=>s+1);
    setReading(""); setPrevRead(""); setAiOk(false);
  };

  return (
    <>
      <style>{css}</style>
      <div className="app">
        {!onboarded && <Onboarding onDone={()=>setOnboarded(true)}/>}
        <div className="z1 scr">
          <div className="hdr">
            <div className="logo">
              <div className="logo-mark">
                <svg viewBox="0 0 28 28" fill="none" width="14" height="14"><path d="M14 4C9 4 5 8 5 13c0 3.6 2 6.7 5 8.3V24h8v-2.7c3-1.6 5-4.7 5-8.3 0-5-4-9-9-9z" fill="currentColor" opacity=".9"/><path d="M11 13c0-1.7 1.3-3 3-3s3 1.3 3 3" stroke="#fff" strokeWidth="1.5" strokeLinecap="round" opacity=".7"/></svg>
              </div>
              <div>
                <div className="logo-name">Green Utility Log</div>
                <div className="logo-tag">VeBetterDAO · VeChain</div>
              </div>
            </div>
            <div className="hdr-actions">
              <div className="dark-toggle" onClick={()=>setDark(d=>!d)}>
                {dark
                  ? <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" width="14" height="14"><path d="M17 11.5A7 7 0 119.5 3a5 5 0 007.5 8.5z" fill="currentColor" opacity=".15"/><path d="M17 11.5A7 7 0 119.5 3a5 5 0 007.5 8.5z"/></svg>
                  : <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" width="14" height="14"><circle cx="10" cy="10" r="4"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4"/></svg>
                }
              </div>
              <div className={`online-pill ${online?"on":"off"}`}>
                <span className="online-dot"/>
                {online ? "Online" : "Offline"}
              </div>
              <div className={`wallet-pill ${wallet?"connected":""}`} onClick={()=>!wallet&&setShowWallet(true)}>
                <span className={`wdot ${wallet?"":"off"}`}/>
                {wallet ? <span className="waddr">{wallet}</span> : <span className="wconnect">Connect</span>}
              </div>
            </div>
          </div>
          {tab==="home" && <HomeScreen b3tr={b3tr} streak={streak} subs={subs} setTab={setTab} testnet={testnet} T={T}/>}
          {tab==="submit" && <SubmitScreen selUtil={selUtil} setSelUtil={handleSelUtil} reading={reading} setReading={setReading} prevRead={prevRead} setPrevRead={setPrevRead} aiOk={aiOk} setAiOk={setAiOk} busy={busy} handleSubmit={handleSubmit} wallet={wallet} setShowWallet={setShowWallet} subs={subs} T={T}/>}
          {tab==="charts" && <ChartsScreen T={T}/>}
          {tab==="leaderboard" && <LeaderboardScreen b3tr={b3tr} streak={streak} T={T}/>}
          {tab==="history" && <HistoryScreen subs={subs} T={T}/>}
          {tab==="profile" && <ProfileScreen b3tr={b3tr} streak={streak} subs={subs} wallet={wallet} setShowWallet={setShowWallet} dark={dark} setDark={setDark} notifs={notifs} setNotifs={setNotifs} setOnboarded={setOnboarded} testnet={testnet} setTestnet={setTestnet} T={T}/>}
        </div>

        <nav className="bnav">
          {[
            {id:"home", l:"Home", svg:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" width="20" height="20"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>},
            {id:"submit", l:"Submit", svg:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" width="20" height="20"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M7 6V4a1 1 0 011-1h8a1 1 0 011 1v2"/><circle cx="12" cy="13" r="3"/></svg>},
            {id:"charts", l:"Charts", svg:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" width="20" height="20"><path d="M3 20h18"/><rect x="5" y="12" width="3" height="8" rx="1"/><rect x="10.5" y="7" width="3" height="13" rx="1"/><rect x="16" y="3" width="3" height="17" rx="1"/></svg>},
            {id:"leaderboard", l:"Ranks", svg:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" width="20" height="20"><path d="M8 21H4a1 1 0 01-1-1v-4a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1z"/><path d="M14 21h-4V11a1 1 0 011-1h2a1 1 0 011 1v10z"/><path d="M20 21h-4V7a1 1 0 011-1h2a1 1 0 011 1v14z"/></svg>},
            {id:"profile", l:"Profile", svg:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" width="20" height="20"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>},
          ].map(n => (
            <button key={n.id} className={`nitem ${tab===n.id?"active":""}`} onClick={()=>setTab(n.id)}>
              <div className="nicon">{n.svg}</div>
              <span className="nlabel">{n.l}</span>
            </button>
          ))}
        </nav>
      </div>
    </>
  );
}

function HomeScreen({ b3tr, streak, subs, setTab, testnet, T }) {
  return (
    <div>
      <div className="hero">
        <div className="hero-label">Total B3TR Earned</div>
        <div className="hero-amount">{b3tr.toFixed(2)}<span>B3TR</span></div>
        <div className="hero-usd">${(b3tr * 0.15).toFixed(2)} USD</div>
        <div className="hero-chips">
          <div className="hchip"><div className="hchip-val">{streak}</div><div className="hchip-key">Day Streak</div></div>
          <div className="hchip"><div className="hchip-val">{subs.length}</div><div className="hchip-key">Submissions</div></div>
        </div>
      </div>
      {testnet && <div style={{background:T.gasBg,border:`1px solid ${T.gasBorder}`,color:T.gas,padding:"8px 14px",borderRadius:3,fontSize:10,fontWeight:700,textAlign:"center",margin:"0 14px 10px",fontFamily:"'SF Mono',Menlo,'Courier New',monospace",letterSpacing:".4px",textTransform:"uppercase"}}>Testnet — Test B3TR only. Switch to MainNet in Settings.</div>}
      <div className="sec"><div className="sec-line"/><div className="sec-txt">Quick Submit</div><div className="sec-line"/></div>
      <div className="util-grid">
        {UTILS.map(u => (
          <div key={u.id} className="ucard" onClick={()=>setTab("submit")}>
            <div className="ucard-icon" style={{background:T[u.id+"Bg"]||T.green5,border:`1px solid ${T[u.id+"Border"]||T.green4}`,color:T[u.id]||T.green2}}>{UTIL_ICONS[u.id]}</div>
            <div className="ucard-name">{u.label}</div>
            <div className="ucard-reads">{u.rate} B3TR/{u.unit}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function SubmitScreen({ selUtil, setSelUtil, reading, setReading, prevRead, setPrevRead, aiOk, setAiOk, busy, handleSubmit, wallet, setShowWallet, subs, T }) {
  const u = getUtil(selUtil);
  return (
    <div style={{padding:"16px 14px"}}>
      <div className="page-title">Submit Reading</div>
      <div className="page-sub">Current Meter: {u.label}</div>
      <div className="form-card">
        <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:".8px",color:T.textSoft,marginBottom:10}}>Previous Reading</div>
        <input type="number" placeholder="e.g. 3834.8" value={prevRead} onChange={(e)=>setPrevRead(e.target.value)} style={{width:"100%",padding:"10px",border:`1px solid ${T.border}`,borderRadius:4,fontSize:12,fontFamily:"'SF Mono',Menlo,'Courier New',monospace",background:T.white,color:T.text,outline:"none",marginBottom:14}}/>
        <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:".8px",color:T.textSoft,marginBottom:10}}>Current Reading</div>
        <input type="number" placeholder="e.g. 3847.2" value={reading} onChange={(e)=>setReading(e.target.value)} style={{width:"100%",padding:"10px",border:`1px solid ${T.border}`,borderRadius:4,fontSize:12,fontFamily:"'SF Mono',Menlo,'Courier New',monospace",background:T.white,color:T.text,outline:"none"}}/>
      </div>
      {!wallet
        ? <button onClick={() => setShowWallet(true)} style={{width:"100%",background:T.green1,border:"none",borderRadius:4,padding:"14px",color:"#fff",fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif",fontSize:12,fontWeight:700,cursor:"pointer"}}>Connect Wallet to Submit</button>
        : <button onClick={handleSubmit} disabled={!reading||!prevRead} style={{width:"100%",background:T.green1,border:"none",borderRadius:4,padding:"14px",color:"#fff",fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif",fontSize:12,fontWeight:700,cursor:"pointer",opacity:(!reading||!prevRead)?0.4:1}}>Submit & Earn B3TR</button>
      }
    </div>
  );
}

function ChartsScreen({ T }) {
  return <div style={{padding:"16px"}}><div className="page-title">Charts</div><p style={{color:T.textSoft}}>Analytics coming soon...</p></div>;
}

function LeaderboardScreen({ b3tr, streak, T }) {
  return (
    <div>
      <div className="page-title">Leaderboard</div>
      {LEADERBOARD_DATA.map(item => (
        <div key={item.rank} className="lb-item">
          <div className={`lb-av ${item.isMe?"me":""}`}>{item.isMe ? "Me" : item.name.slice(0,2)}</div>
          <div className="lb-info">
            <div className="lb-name">#{item.rank} {item.name}</div>
            <div className="lb-addr">{item.addr}</div>
            <div className="lb-streak">{item.streak}d streak</div>
          </div>
          <div className="lb-right">
            <div className="lb-b3tr">{item.b3tr}</div>
            <div className="lb-chip">{item.tier}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

function HistoryScreen({ subs, T }) {
  return (
    <div>
      <div className="page-title">History</div>
      {subs.map(s => (
        <div key={s.id} className="hitem">
          <div className="hicon" style={{background:T[getUtil(s.type).id+"Bg"]||T.green5,border:`1px solid ${T[getUtil(s.type).id+"Border"]||T.green4}`,color:T[getUtil(s.type).id]||T.green2}}>{UTIL_ICONS[s.type]}</div>
          <div className="hinfo">
            <div className="htitle">{getUtil(s.type).label}</div>
            <div className="hdelta">{parseFloat(s.cur)-parseFloat(s.prev)} {getUtil(s.type).unit}</div>
          </div>
          <div style={{textAlign:"right",flex:"0 0 auto"}}>
            <div style={{fontSize:13,fontWeight:600,fontFamily:"'SF Mono',Menlo,'Courier New',monospace",color:T.green2}}>+{s.b3tr.toFixed(2)}</div>
            <div className="hstatus">{s.date}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

function ProfileScreen({ b3tr, streak, subs, wallet, setShowWallet, dark, setDark, notifs, setNotifs, setOnboarded, testnet, setTestnet, T }) {
  return (
    <div style={{paddingBottom:20}}>
      <div className="page-title">Profile</div>
      <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:5,padding:16,margin:"0 14px 16px",boxShadow:`0 2px 6px ${T.shadow}`}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
          <div style={{width:40,height:40,borderRadius:"50%",background:T.green3,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,fontWeight:700}}>EG</div>
          <div>
            <div style={{fontSize:14,fontWeight:700,color:T.text}}>EcoMeter_42</div>
            <div style={{fontSize:10,color:T.textSoft}}>{wallet}</div>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <div style={{textAlign:"center",padding:10,background:T.bgAlt,borderRadius:4}}>
            <div style={{fontSize:16,fontWeight:700,fontFamily:"'SF Mono',Menlo,'Courier New',monospace",color:T.text}}>{b3tr.toFixed(2)}</div>
            <div style={{fontSize:8,fontWeight:700,textTransform:"uppercase",letterSpacing:".8px",color:T.textSoft,marginTop:4}}>B3TR</div>
          </div>
          <div style={{textAlign:"center",padding:10,background:T.bgAlt,borderRadius:4}}>
            <div style={{fontSize:16,fontWeight:700,fontFamily:"'SF Mono',Menlo,'Courier New',monospace",color:T.text}}>{streak}</div>
            <div style={{fontSize:8,fontWeight:700,textTransform:"uppercase",letterSpacing:".8px",color:T.textSoft,marginTop:4}}>Streak</div>
          </div>
        </div>
      </div>
      <div className="sec"><div className="sec-line"/><div className="sec-txt">Settings</div><div className="sec-line"/></div>
      <div style={{margin:"0 14px"}}>
        <div onClick={()=>setDark(d=>!d)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:12,background:T.card,border:`1px solid ${T.border}`,borderRadius:4,marginBottom:8,cursor:"pointer"}}>
          <div>
            <div style={{fontSize:11,fontWeight:700,color:T.text}}>Dark Mode</div>
            <div style={{fontSize:9,color:T.textSoft}}>{dark?"On":"Off"}</div>
          </div>
          <input type="checkbox" checked={dark} onChange={()=>setDark(d=>!d)} style={{cursor:"pointer"}}/>
        </div>
        <div onClick={()=>setTestnet(t=>!t)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:12,background:T.card,border:`1px solid ${T.border}`,borderRadius:4,marginBottom:8,cursor:"pointer"}}>
          <div>
            <div style={{fontSize:11,fontWeight:700,color:T.text}}>VeChain Network</div>
            <div style={{fontSize:9,color:T.textSoft}}>{testnet?"TestNet":"MainNet"}</div>
          </div>
          <input type="checkbox" checked={testnet} onChange={()=>setTestnet(t=>!t)} style={{cursor:"pointer"}}/>
        </div>
      </div>
    </div>
  );
}

function Onboarding({ onDone }) {
  const [slide, setSlide] = useState(0);
  const isSetup = slide === ONBOARD_SLIDES.length;
  const s = !isSetup ? ONBOARD_SLIDES[slide] : null;

  return (
    <div className="onboard">
      {s && <div className="ob-icon">{s.icon}</div>}
      {s && <div className="ob-title" style={{color:s.color}}>{s.title}</div>}
      {s && <div className="ob-sub">{s.sub}</div>}
      {isSetup && <div className="ob-title">Register Your Meters</div>}
      {isSetup && <div className="ob-sub" style={{marginBottom:20}}>Enter your current meter readings.</div>}
      <div className="ob-dots">
        {[...Array(ONBOARD_SLIDES.length + 1)].map((_, i) => (
          <div key={i} className={`ob-dot ${slide === i ? "active" : ""}`}/>
        ))}
      </div>
      <button className="ob-btn" onClick={() => isSetup ? onDone() : setSlide(s => s+1)}>
        {isSetup ? "Start Tracking" : "Continue →"}
      </button>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
