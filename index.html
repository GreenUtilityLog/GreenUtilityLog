<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Clickjacking protection: this page asks for wallet signatures, so it must
       never work inside another site's frame, where a phishing page could lay its
       own buttons over ours. GitHub Pages can't send X-Frame-Options or a CSP
       header, and browsers ignore frame-ancestors in a meta tag — so this script
       does it: inside a frame the app is hidden behind a link that opens it in its
       own window, and nothing of it can be clicked. -->
  <style>html[data-framed] #root{display:none!important}</style>
  <script>
    (function () {
      var framed;
      try { framed = window.self !== window.top; } catch (e) { framed = true; }
      if (!framed) return;
      document.documentElement.setAttribute('data-framed', '');
      document.addEventListener('DOMContentLoaded', function () {
        var a = document.createElement('a');
        a.href = location.href; a.target = '_blank'; a.rel = 'noopener';
        a.textContent = 'Open Green Utility Log in its own window';
        a.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font:600 16px system-ui,sans-serif;color:#fff;background:#1a3326;z-index:2147483647';
        document.body.appendChild(a);
      });
    })();
  </script>
  <meta name="theme-color" content="#1a3326">
  <meta name="description" content="Snap your electricity meter, log usage, earn B3TR for saving energy. A VeBetterDAO x2earn app on VeChain.__NETWORK_NOTE__">
  <title>Green Utility Log</title>
  <!-- Social link-preview card. og-image.png lives in public/ so it publishes at the
       site root. Update the absolute URL if you host on a different path/domain. -->
  <meta property="og:title" content="Green Utility Log — earn B3TR for saving energy">
  <meta property="og:description" content="Snap your electricity meter, log usage, earn B3TR. A VeBetterDAO x2earn app on VeChain.__NETWORK_NOTE_OG__">
  <meta property="og:image" content="https://greenutilitylog.github.io/GreenUtilityLog/og-image.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://greenutilitylog.github.io/GreenUtilityLog/og-image.png">
  <link rel="icon" type="image/png" href="icon.png">
</head>
<body>
  <div id="root"></div>
  <!-- Early error catcher: shows any startup error on the page (even one thrown
       while the bundle is still loading, before the app's own handlers exist),
       so a failure never silently leaves a blank white screen. -->
  <script>
    (function () {
      function show(label, err) {
        // Only for startup, which is what this is for: a blank screen with no clue.
        // Once the app is on screen it has its own error handling, and a red box
        // that covers the page and cannot be closed — for a clipboard copy that
        // failed, say — is worse than the error it reports.
        var root = document.getElementById('root');
        if (root && root.dataset.appMounted) { try { console.error(label, err); } catch (x) {} return; }
        var detail = (err && (err.stack || err.message)) || String(err);
        var b = document.createElement('pre');
        b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;max-height:70vh;overflow:auto;margin:0;padding:12px;font:12px/1.4 monospace;white-space:pre-wrap;word-break:break-word;color:#fff;background:#b00020';
        b.textContent = label + ' ' + detail + '\n\n(tap to close)';
        b.onclick = function () { b.remove(); };
        document.body.appendChild(b);
      }
      window.addEventListener('error', function (e) { show('JS error:', e.error || e.message); });
      window.addEventListener('unhandledrejection', function (e) { show('Promise error:', e.reason); });
    })();
  </script>
  <script type="module" src="src/main.jsx"></script>
</body>
</html>
