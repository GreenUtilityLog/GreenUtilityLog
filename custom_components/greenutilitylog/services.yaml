push_now:
  name: Send reading now
  description: >-
    Reads the configured meter entity and sends it to GreenUtilityLog immediately,
    without waiting for the next interval. Handy right after setup, or to test.
  fields:
    config_entry_id:
      name: Entry
      description: Send only for this GreenUtilityLog entry. Leave empty to send for all of them.
      required: false
      selector:
        config_entry:
          integration: greenutilitylog
