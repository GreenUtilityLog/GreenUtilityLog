[tool:pytest]
testpaths = tests
# Required by pytest-homeassistant-custom-component: Home Assistant's own tests are
# written as bare `async def test_…` with no @pytest.mark.asyncio, so pytest-asyncio
# has to pick them up automatically. Harmless when that plugin isn't installed —
# pytest just warns about an unknown option, and tests/test_logic.py drives its own
# event loop via asyncio.run().
asyncio_mode = auto
